server:
  port: 8086
  error:
    include-message: always
spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://localhost:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:notification_user}
    password: ${DB_PASSWORD:notification_pass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

internal:
  token: ${INTERNAL_TOKEN:cinema-internal-token-2024}
